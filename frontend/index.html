<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Meta Tags -->
    <meta
            name="description"
            content="Generate comprehensive test suites using multiple LLMs collaborating in real-time. Powered by LLM Council Architecture."
    />
    <meta name="theme-color" content="#0a0e27" />
    <meta
            name="keywords"
            content="AI, LLM, Test Generation, Gemini, GPT, Qwen, Testing"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="LLM Council - AI Test Generator" />
    <meta
            property="og:description"
            content="Experience next-generation test generation using multiple LLMs"
    />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap"
            rel="stylesheet"
    />

    <title>LLM Council - AI Test Generator</title>

    <!-- Inline Critical CSS (optional for faster first paint) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont,
            'Segoe UI', sans-serif;
            background: #0a0e27;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        /* Loading state */
        .app-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0a0e27;
        }

        .app-loading::after {
            content: '';
            width: 50px;
            height: 50px;
            border: 3px solid rgba(96, 165, 250, 0.2);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<noscript>
    <div
            style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    padding: 20px;
                    text-align: center;
                "
    >
        <div>
            <h1>JavaScript Required</h1>
            <p>
                This application requires JavaScript to run. Please enable
                JavaScript in your browser.
            </p>
        </div>
    </div>
</noscript>

<div id="root">
    <div class="app-loading"></div>
</div>

<!-- Application Entry Point -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
